
trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: "Build and Test"

    jobs:
      - job: BuildApp
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            displayName: "Install dependencies"

          - script: npm test
            displayName: "Run tests"

          - script: npm run build
            displayName: "Build application"

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'dist'
              ArtifactName: 'app'

  - stage: Deploy
    displayName: "Deploy to Azure"
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: DeployApp
        environment: staging

        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: app

                - script: echo "Deploy application"
                  displayName: "Deployment placeholder"
